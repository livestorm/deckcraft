[package]
name = "deckcraft-player-web"
description = "DeckCraft player for the browser: deckcraft-player behind a wasm-bindgen API, run in a Web Worker"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# wasm-bindgen's generated glue contains `unsafe` blocks, which the workspace's
# `unsafe_code = "forbid"` rejects; this crate holds no other code that would need it.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
deckcraft-player = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
